<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibhash Photo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.card {
    position: relative;
    width: 94vw;
    max-width: 500px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(255,255,255,.25);
    animation: enter 1.2s ease;
}

.card img {
    width: 100%;
    height: auto;
    display: block;
    animation: zoom 7s ease-in-out infinite alternate;
}

.overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 45px 15px 25px;
    text-align: center;
    color: white;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );
}

h1 {
    font-size: clamp(28px, 8vw, 44px);
    text-shadow: 0 2px 10px black;
    animation: glow 2s infinite alternate;
}

p {
    margin-top: 7px;
    font-size: 17px;
}

.heart {
    display: inline-block;
    animation: beat 1s infinite;
}

.sparkle {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    animation: fly 5s linear forwards;
    font-size: 22px;
}

@keyframes enter {
    from {
        opacity: 0;
        transform: scale(.85) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
}

@keyframes glow {
    from { text-shadow: 0 2px 8px black; }
    to { text-shadow: 0 2px 18px #ff4f81; }
}

@keyframes beat {
    50% { transform: scale(1.35); }
}

@keyframes fly {
    from {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    15% { opacity: 1; }
    to {
        transform: translateY(-110vh) translateX(var(--x));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">
    <img src="photo.jpg" alt="Vibhash">

    <div class="overlay">
        <h1>Vibhash <span class="heart">❤️</span></h1>
        <p>✨ My Photo ✨</p>
    </div>
</div>

<script>
function createSparkle() {
    const s = document.createElement("div");
    s.className = "sparkle";

    const symbols = ["❤️", "💕", "✨", "💖", "🌟"];
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    s.style.left = Math.random() * 100 + "vw";
    s.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
    s.style.animationDuration = (4 + Math.random() * 3) + "s";

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 7000);
}

setInterval(createSparkle, 500);
</script>

</body>
</html>
